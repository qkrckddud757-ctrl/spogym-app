<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스포짐 서교점 통합 관리 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--line:#e4e8f0;
    --ink:#0f1830;--ink-2:#4a5675;--ink-3:#8894b0;
    --navy:#10367D;--navy-2:#0e1a38;--gold:#E8A63C;--gold-soft:#fbf3e2;
    --good:#1f9d63;--good-soft:#e6f6ee;--warn:#d98218;--warn-soft:#fdf1e0;--crit:#d63b48;--crit-soft:#fbe9ea;
    --shadow:0 1px 3px rgba(16,30,60,.06),0 6px 20px rgba(16,30,60,.05);
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b1120;--surface:#131c31;--surface-2:#0f1728;--line:#26304a;
    --ink:#eaf0fb;--ink-2:#a6b2ce;--ink-3:#6b769a;
    --navy:#3f6fd1;--navy-2:#5c86e0;--gold:#f0b755;--gold-soft:#2a2412;
    --good:#3ec07f;--good-soft:#122a1e;--warn:#e8a24a;--warn-soft:#2c2211;--crit:#f0616e;--crit-soft:#2c1418;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0b1120;--surface:#131c31;--surface-2:#0f1728;--line:#26304a;
    --ink:#eaf0fb;--ink-2:#a6b2ce;--ink-3:#6b769a;
    --navy:#3f6fd1;--navy-2:#5c86e0;--gold:#f0b755;--gold-soft:#2a2412;
    --good:#3ec07f;--good-soft:#122a1e;--warn:#e8a24a;--warn-soft:#2c2211;--crit:#f0616e;--crit-soft:#2c1418;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;word-break:keep-all;}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;}
  .side{background:var(--navy-2);color:#e8eefc;padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px;}
  .brand b{font-size:18px;font-weight:800;letter-spacing:-.4px;color:#fff;display:block;}
  .brand span{font-size:12px;color:#9db0d8;}
  .nav{background:none;border:none;color:#b7c4e2;font:inherit;font-size:14px;font-weight:600;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s;width:100%;}
  .nav:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav.on{background:var(--navy);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .nav .ic{font-size:15px;width:20px;text-align:center;}
  .side-foot{margin-top:auto;font-size:11px;color:#6b7ba6;padding:12px 10px 0;line-height:1.6;}
  .main{padding:22px 30px 60px;max-width:1180px;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .top h1{font-size:22px;font-weight:800;letter-spacing:-.5px;}
  .top .sub{color:var(--ink-2);font-size:13px;margin-top:3px;}
  .top-ctrl{display:flex;gap:8px;align-items:center;}
  .who{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
  .theme-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow);}
  .kpi .lab{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:6px;}
  .kpi .val{font-size:24px;font-weight:800;letter-spacing:-.7px;}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--ink-3);}
  .kpi .foot{font-size:11.5px;margin-top:5px;color:var(--ink-3);}
  .kpi.accent{background:linear-gradient(135deg,var(--navy),var(--navy-2));border:none;color:#fff;}
  .kpi.accent .lab,.kpi.accent .foot{color:#b9c8ea;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
  .card-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .card-h h2{font-size:15.5px;font-weight:800;letter-spacing:-.3px;}
  .card-h .hint{font-size:12px;color:var(--ink-3);}
  .tw{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px;}
  th{text-align:right;padding:10px 13px;font-size:11.5px;font-weight:700;color:var(--ink-3);border-bottom:1.5px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;padding-left:20px;}
  td{text-align:right;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .name{font-weight:700;}
  .rank{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);margin-left:6px;}
  .rank.pl{background:var(--gold-soft);color:var(--gold);border-color:transparent;}
  .pay{font-weight:800;color:var(--navy);}
  .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle;}
  .bar i{display:block;height:100%;border-radius:4px;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.good{background:var(--good-soft);color:var(--good);}.pill.warn{background:var(--warn-soft);color:var(--warn);}.pill.crit{background:var(--crit-soft);color:var(--crit);}
  .contact{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);}
  .contact:last-child{border-bottom:none;}
  .ring{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;}
  .contact .info{flex:1;min-width:0;}
  .contact .info b{font-size:14px;}
  .contact .info .meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .act{font-size:12px;color:var(--navy);font-weight:700;background:var(--surface-2);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:18px 20px;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-size:11.5px;font-weight:700;color:var(--ink-2);}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);}
  .fld textarea{resize:vertical;min-height:60px;}.fld.full{grid-column:1/-1;}
  .btn{background:var(--navy);color:#fff;border:none;font:inherit;font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:9px;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}.btn.gold{background:var(--gold);}
  .btn-row{padding:0 20px 18px;display:flex;gap:10px;flex-wrap:wrap;}
  .guide{padding:8px 22px 22px;}
  .guide h3{font-size:15px;font-weight:800;margin:20px 0 9px;color:var(--navy);}
  .guide p{font-size:13.5px;color:var(--ink-2);margin-bottom:9px;max-width:64ch;}
  .guide .box{background:var(--surface-2);border-left:3px solid var(--gold);border-radius:0 9px 9px 0;padding:13px 16px;margin:10px 0;font-size:13px;color:var(--ink);line-height:1.7;}
  .guide .box b{color:var(--navy);}
  .guide ul{margin:6px 0 12px 4px;list-style:none;}
  .guide li{font-size:13px;color:var(--ink-2);padding:4px 0 4px 20px;position:relative;line-height:1.6;}
  .guide li::before{content:'→';position:absolute;left:0;color:var(--gold);font-weight:800;}
  .ai-note{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:11px;padding:14px 17px;font-size:13px;color:var(--ink);margin:0 0 16px;line-height:1.65;}
  .ai-out{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:16px 18px;font-size:13.5px;color:var(--ink-2);line-height:1.7;white-space:pre-wrap;margin:0 20px 18px;}
  .seed-note{font-size:11.5px;color:var(--ink-3);padding:2px 20px 14px;line-height:1.6;}
  .cc{background:linear-gradient(150deg,#10367D,#0e1a38);border-radius:16px;padding:26px 24px;color:#fff;margin:0 20px 18px;position:relative;overflow:hidden;}
  .cc .grade{position:absolute;top:16px;right:20px;background:var(--gold);color:#1a1300;font-size:12px;font-weight:900;padding:4px 12px;border-radius:20px;}
  .cc .hook{font-size:22px;font-weight:900;line-height:1.3;margin:10px 0 16px;max-width:26ch;}
  .cc .hook b{color:var(--gold);}
  .cc .esr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px;}
  .cc .e{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 12px;}
  .cc .e .t{font-size:11px;color:#ffd98a;font-weight:800;margin-bottom:5px;}
  .cc .e .d{font-size:12.5px;color:#e9eefb;line-height:1.5;}
  .slideshow{margin:0 20px 18px;}
  .slide{background:linear-gradient(150deg,#10367D,#0e1a38);border-radius:16px;padding:44px 32px;color:#fff;min-height:320px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .slide .tag{position:absolute;top:18px;left:26px;font-size:12px;color:#ffd98a;font-weight:800;letter-spacing:2px;}
  .slide .pg{position:absolute;top:18px;right:26px;font-size:12px;color:#8fa8d9;font-weight:700;}
  .slide h2{font-size:30px;font-weight:900;line-height:1.32;margin-bottom:14px;letter-spacing:-1px;}
  .slide h2 b{color:var(--gold);}
  .slide .big{font-size:38px;font-weight:900;color:var(--gold);margin:8px 0 14px;letter-spacing:-1px;}
  .slide p{font-size:17px;color:#e9eefb;line-height:1.65;max-width:36ch;}
  .snav{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 0 4px;}
  .snav button{background:var(--navy);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1;}
  .snav button:hover{filter:brightness(1.12);}
  .snav .dots{display:flex;gap:6px;align-items:center;}
  .snav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s;}
  .snav .dot.on{background:var(--gold);width:22px;border-radius:4px;}
  .load{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;}
  @media(max-width:820px){.app{grid-template-columns:1fr;}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:5px;}.brand{width:100%;border:none;padding-bottom:6px;margin-bottom:4px;}.side-foot{display:none;}.kpis{grid-template-columns:1fr 1fr;}.main{padding:16px;}.cc .esr{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>스포짐 서교점</b><span>PT · 필라 통합 관리</span></div>
    <button class="nav on" data-t="dash"><span class="ic">📊</span> 트레이너 종합</button>
    <button class="nav" data-t="recon"><span class="ic">🔄</span> 재등록 컨택</button>
    <button class="nav" data-t="input"><span class="ic">✍️</span> 매출·수업 입력</button>
    <button class="nav" data-t="member"><span class="ic">👤</span> 담당회원 특이사항</button>
    <button class="nav" data-t="consult"><span class="ic">🎨</span> 상담자료 생성</button>
    <button class="nav" data-t="guide"><span class="ic">📖</span> 매출 1000만 전략</button>
    <button class="nav" data-t="ai"><span class="ic">🤖</span> AI 지속 컨설팅</button>
    <div class="side-foot">v4 · DB 연동<br>실시간 공유 ✅</div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="ttl">트레이너 종합</h1><div class="sub" id="sub"></div></div>
      <div class="top-ctrl">
        <select class="who" id="who"><option value="ALL">👥 전체 보기</option></select>
        <button class="theme-btn" id="theme">🌗</button>
      </div>
    </div>
    <div id="view"><div class="load">⏳ 데이터 불러오는 중…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://smajojsdobwfozanrvld.supabase.co';
const SB_KEY='sb_publishable_g8-HxJHsSAOSbKsTl4yc7w_TK1VqZXb';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const STAFF=[
  {name:'정환인',rank:'팀장',base:1300000,type:'PT'},
  {name:'문종수',rank:'팀장',base:1200000,type:'PT'},
  {name:'신용준',rank:'팀장',base:1200000,type:'PT'},
  {name:'최동식',rank:'주임',base:1000000,type:'PT'},
  {name:'강승구',rank:'사원',base:900000,type:'PT'},
  {name:'김종인',rank:'사원',base:900000,type:'PT'},
  {name:'박성훈',rank:'사원',base:900000,type:'PT'},
  {name:'이미로',rank:'사원',base:900000,type:'필라'},
];
const won=n=>Math.round(n||0).toLocaleString('ko-KR'),man=n=>Math.round((n||0)/10000).toLocaleString('ko-KR');
let WHO='ALL', DB={sales:[],members:[],contacts:[],sessions:[]}, CUR='dash';
const isMe=t=>WHO==='ALL'||t===WHO;
const info=t=>STAFF.find(s=>s.name===t)||{base:0,type:'PT',rank:''};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);};

async function loadAll(){
  try{
    const [s,m,c,se]=await Promise.all([
      sb.from('pt_sales').select('*').order('id'),
      sb.from('members').select('*').order('id'),
      sb.from('contacts').select('*').order('id'),
      sb.from('sessions').select('*').order('id')]);
    DB.sales=s.data||[];DB.members=m.data||[];DB.contacts=c.data||[];DB.sessions=se.data||[];
  }catch(e){toast('연결 오류: '+e.message);}
}
// 트레이너 8월 매출(VAT제외)
const salesOf=t=>DB.sales.filter(x=>x.trainer===t).reduce((a,x)=>a+(+x.vat||0),0);
const sessOf=t=>DB.sessions.filter(x=>x.trainer===t).reduce((a,x)=>a+(+x.cnt||0),0);
function sessionPrice(){ return +(localStorage.getItem('session_price')||50000); } // 세션단가(부가세제외)
function setSP(v){ localStorage.setItem('session_price',Math.max(1,Math.round(+v)||50000)); render(); }
function calcPay(t){
  const sales=salesOf(t.name),sess=sessOf(t.name);const SP=sessionPrice();let fee=0,inc=0,rl='',unit=0;
  if(t.type==='PT'){
    const b=[[10000000,.53],[9000000,.5],[8000000,.45],[7000000,.37],[5000000,.34],[3500000,.32],[0,.3]];
    const r=b.find(x=>sales>=x[0])[1];unit=Math.round(SP*r);fee=unit*sess;rl=(r*100)+'%';
    if(sales>=10000000)inc=Math.floor((sales-10000000)/1000000)*100000;
  }else{ // 필라: 800↑ 세션 정액, 그 미만 세션단가×배분율
    if(sales>=10000000){unit=33000;fee=sess*33000;rl='세션 33,000';}
    else if(sales>=8000000){unit=30000;fee=sess*30000;rl='세션 30,000';}
    else{const b=[[5000000,.5],[3500000,.45],[0,.4]];const r=b.find(x=>sales>=x[0])[1];unit=Math.round(SP*r);fee=unit*sess;rl=(r*100)+'%';}
  }
  return {sales,sess,rl,unit,fee,inc,total:info(t.name).base+fee+inc};
}
function needNote(t){const s=150-sessOf(t.name),m=10000000-salesOf(t.name),n=[];if(s>0)n.push(`수업 ${s}개↑`);if(m>0)n.push(`매출 ${man(m)}만↑`);return n.length?n.join(' · '):'목표 달성';}

const V={};
V.dash=()=>{
  const list=STAFF.filter(t=>isMe(t.name));
  const rows=list.map(t=>{
    const p=calcPay(t),sPct=Math.min(100,Math.round(p.sess/150*100)),mPct=Math.min(100,Math.round(p.sales/10000000*100));
    const st=(sPct>=100&&mPct>=100)?'good':(sPct<50||mPct<50)?'crit':'warn',stt=st==='good'?'목표달성':st==='crit'?'분발필요':'진행중',bc=st==='good'?'var(--good)':st==='crit'?'var(--crit)':'var(--warn)';
    return `<tr><td><span class="name">${t.name}</span><span class="rank ${t.rank==='팀장'?'pl':''}">${t.rank}${t.type==='필라'?'·필라':''}</span></td>
      <td class="num">${won(t.base)}</td><td class="num" style="font-weight:700">${won(p.sales)}</td>
      <td class="num" style="color:var(--ink-2)">${p.rl}<br><span style="font-size:10.5px;color:var(--ink-3)">세션 ${won(p.unit)}</span></td><td class="num" style="font-weight:700">${won(p.fee)}</td><td class="num">${p.inc?won(p.inc):'—'}</td>
      <td class="pay num">${won(p.total)}</td><td class="num">${p.sess}<span style="color:var(--ink-3)">/150</span><br><span class="bar"><i style="width:${sPct}%;background:${bc}"></i></span></td>
      <td><span class="pill ${st}">${stt}</span><div style="font-size:11px;color:var(--ink-2);margin-top:4px;max-width:170px;white-space:normal;text-align:left">${needNote(t)}</div></td></tr>`;
  }).join('');
  const tS=list.reduce((a,t)=>a+salesOf(t.name),0),tP=list.reduce((a,t)=>a+calcPay(t).total,0),tSe=list.reduce((a,t)=>a+sessOf(t.name),0);
  return `<div class="kpis">
    <div class="kpi accent"><div class="lab">💰 매출(VAT제외)</div><div class="val num">${man(tS)}<small>만</small></div><div class="foot">목표 ${WHO==='ALL'?'8,000만':'1,000만'}</div></div>
    <div class="kpi"><div class="lab">🏋️ 수업수</div><div class="val num">${tSe}<small>개</small></div><div class="foot">목표 ${WHO==='ALL'?'1,200':'150'}</div></div>
    <div class="kpi"><div class="lab">💳 급여(예상)</div><div class="val num">${man(tP)}<small>만</small></div></div>
    <div class="kpi"><div class="lab">📋 매출 건수</div><div class="val num">${DB.sales.filter(x=>isMe(x.trainer)).length}<small>건</small></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>👥 급여·목표 자동계산</h2><span class="hint">세션단가 <input type="number" value="${sessionPrice()}" onchange="setSP(this.value)" style="width:78px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:12px"> 원(VAT제외) · 수업료 = 단가 × 율 × 수업수</span></div>

V.ai=()=>{
  if(WHO==='ALL'){
    const tS=STAFF.reduce((a,t)=>a+salesOf(t.name),0),tSe=STAFF.reduce((a,t)=>a+sessOf(t.name),0);
    const worst=STAFF.map(t=>({t,g:150-sessOf(t.name)})).sort((a,b)=>b.g-a.g).slice(0,3);
    return `<div class="ai-note">🤖 <b>AI 지속 컨설팅</b> — <b>우측 상단에서 트레이너를 선택</b>하면 그 트레이너 <b>맞춤 진단·액션플랜</b>이 나옵니다. (지금은 팀 전체)</div>
    <div class="card"><div class="card-h"><h2 style="font-size:15px">📊 팀 전체 진단</h2></div>
    <div class="ai-out">💰 팀 매출 ${man(tS)}만 / 8,000만 목표
🏋️ 팀 수업 ${tSe} / 1,200 목표

🔴 스케줄 집중 필요 TOP3: ${worst.map(w=>w.t.name+'('+w.g+'개↑)').join(', ')}
🎯 다음달 역산(인당 1,000만): 재등록400+소개200+신규OT250+체험100+VIP50

▶ 우측 상단 드롭다운에서 트레이너를 고르면 개인별 구체 컨설팅이 나옵니다.</div></div>`;
  }
  const t=STAFF.find(s=>s.name===WHO); const p=calcPay(t);
  const salesGap=Math.max(0,10000000-p.sales), sessGap=Math.max(0,150-p.sess);
  const cts=DB.members.filter(m=>m.trainer===WHO&&m.remain>0&&m.remain<10).sort((a,b)=>a.remain-b.remain);
  const urgent=cts.filter(c=>c.remain<=3);
  let o=`▎${t.name} ${t.rank}${t.type==='필라'?'(필라)':''} 맞춤 컨설팅\n\n`;
  o+=`💰 매출 ${man(p.sales)}만 / 1,000만 (${Math.round(p.sales/100000)}%)\n`;
  o+=`🏋️ 수업 ${p.sess} / 150 · 수업료율 ${p.rl}\n`;
  o+=`💳 예상 급여 ${won(p.total)}원 (기본급+수업료${p.inc?'+인센':''})\n\n`;
  o+=`🎯 지금 해야 할 것\n`;
  if(cts.length){ o+=`① 재등록 컨택 ${cts.length}명 — ${cts.slice(0,6).map(c=>c.name+'('+c.remain+'회)').join(', ')}${cts.length>6?' 외':''}\n`;
    if(urgent.length) o+=`   🔴 잔여 3회↓ ${urgent.length}명(${urgent.slice(0,4).map(c=>c.name).join(', ')})은 오늘 즉시 클로징\n`;
  } else o+=`① 현재 잔여10회↓ 컨택 대상 없음 — 신규·소개 파이프 집중\n`;
  if(sessGap>0) o+=`② 수업 ${sessGap}개 부족 — 스케줄 더 채우기 (수업량이 곧 수업료)\n`;
  if(salesGap>0) o+=`③ 매출 ${man(salesGap)}만 부족 — 재등록${cts.length}명 클로징 + 신규OT + 소개 요청\n`;
  o+=`\n💡 코칭 포인트\n`;
  o+= p.sess>=100 ? `수업량 최상위. 재등록 파이프만 잡으면 매출 급상승. 소진 임박 회원부터 "다음 목표" 그려주세요.`
     : p.sess>=50 ? `수업량 양호. 재등록·소개로 매출 파이프를 두껍게. 변화 큰 회원에게 소개 요청.`
     : `수업량부터 확보. 스케줄을 채우고, OT·체험 전환율을 높이세요. 당일등록 심리 활용.`;
  return `<div class="ai-note">🤖 <b>${t.name} ${t.rank} 맞춤 컨설팅</b> — 실제 데이터 기반 (Claude API 연동 시 특이사항·심리까지 반영해 더 정교해집니다)</div>
    <div class="card"><div class="ai-out">${o}</div></div>`;
};

async function saveSale(){
  const mem=document.getElementById('s-mem').value.trim();if(!mem){toast('회원명 입력');return;}
  const pay=+document.getElementById('s-pay').value||0, vat=Math.round(pay/1.1);
  const {error}=await sb.from('pt_sales').insert({member:mem,trainer:document.getElementById('s-tr').value,type:document.getElementById('s-type').value,pay,vat,cnt:document.getElementById('s-cnt').value,route:document.getElementById('s-route').value});
  if(error){toast('오류: '+error.message);return;}
  toast('매출 저장됨 ✅');await loadAll();render();
}
async function saveSessions(){
  const inputs=[...document.querySelectorAll('.s-sess')];
  for(const el of inputs){
    const tr=el.dataset.tr,cnt=+el.value||0;
    const ex=DB.sessions.find(x=>x.trainer===tr&&x.month==='2026-08');
    if(ex) await sb.from('sessions').update({cnt}).eq('id',ex.id);
    else await sb.from('sessions').insert({trainer:tr,month:'2026-08',cnt});
  }
  toast('수업수 저장됨 ✅');await loadAll();render();
}

function showSlide(){
  const s=SLIDES[SI];
  const dots=SLIDES.map((_,i)=>`<span class="dot ${i===SI?'on':''}"></span>`).join('');
  document.getElementById('cc-out').innerHTML=`<div class="slideshow">
    <div class="slide"><div class="tag">${s.tag}</div><div class="pg">${SI+1} / 10</div>
    <h2>${s.h}</h2>${s.big?`<div class="big">${s.big}</div>`:''}<p>${s.p}</p></div>
    <div class="snav"><button onclick="slideMove(-1)">‹</button><div class="dots">${dots}</div><button onclick="slideMove(1)">›</button></div></div>`;
}
function slideMove(d){SI=(SI+d+SLIDES.length)%SLIDES.length;showSlide();}
function genScript(){
  const cs=document.getElementById('cs-case').value.trim()||'운동';
  const nm=document.getElementById('cs-name').value.trim()||'회원';
  const goal=document.getElementById('cs-goal').value.trim();
  const add=document.getElementById('cs-add').value.trim();
  const script=`# ${cs} 회원 상담 자료 (스포짐 서교점 · ${nm}님 맞춤)

[제작 지시 — 아래 톤·구조로 시각 슬라이드를 만들어줘]
· 회원이 "완전 내 얘기네" 하고 공감·몰입하게. 쉬운 말, 전문적이고 세련된 디자인.
· 마케팅 후킹 + ESR(기대파괴·자기관련성·해결연결) + SSS급.
· "변화를 판다" — Before/After와 감정(자신감·일상·시선)을 강조.
· 각 슬라이드는 핵심 하나씩. 인체·해부·개념을 그림으로 시각화.

## 1. 공감 — "완전 내 얘기"
${cs} 때문에 이런 고민 있으시죠? ${nm}님이 겪어온 구체적 상황을 짚어주기 (다짐→포기 반복 등). 혼자 하니까 안 됐던 것.

## 2. 왜 지금까지 안 됐나
${cs}에서 흔히 하는 오해·잘못된 방법을 전문적으로 짚기. 근본 원인.

## 3. 현재 진단
${cs} 관련 현재 상태를 숫자·시각으로 명확히.

## 4. 해결책 — 변화의 핵심${goal?' (목표: '+goal+')':''}
근본 원인을 해결하는 방법. 운동+식단/자세+관리를 함께. 왜 이 시스템인지.

## 5. Before → After (변화를 판다)
${cs} 개선 후의 변화. 숫자만이 아니라 달라진 일상·자신감·주변 시선.

## 6. 로드맵
단계별 계획을 그래프·타임라인으로.

## 7. 마무리
가장 좋은 시작은 바로 오늘. ${nm}님 곁에서 함께 만들어 드린다.${add?'\n\n## ✋ 트레이너 추가 요청 (꼭 반영)\n'+add:''}`;
  const prompt=`PT 회원 상담용 시각 슬라이드로 만들어줘. 회원이 "완전 내 얘기네"라고 공감하도록 쉬운 말이되 전문적이고 세련되게. 변화(Before/After) 강조, ${cs} 관련 인체·개념을 그림으로 시각화. 각 슬라이드 핵심 하나씩.`;
  document.getElementById('cs-out').innerHTML=`
    <div style="padding:2px 20px 6px"><b style="font-size:13px">① 원고 — NotebookLM 소스에 붙여넣기</b></div>
    <textarea readonly id="cs-script" style="width:calc(100% - 40px);margin:0 20px;min-height:210px;font:inherit;font-size:12px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)"></textarea>
    <div class="btn-row"><button class="btn" onclick="cpy('cs-script')">📋 원고 복사</button></div>
    <div style="padding:2px 20px 6px"><b style="font-size:13px">② 생성 프롬프트 — 슬라이드 만들 때 입력</b></div>
    <textarea readonly id="cs-prompt" style="width:calc(100% - 40px);margin:0 20px;min-height:64px;font:inherit;font-size:12px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)"></textarea>
    <div class="btn-row"><button class="btn" onclick="cpy('cs-prompt')">📋 프롬프트 복사</button><button class="btn gold" onclick="window.open('https://notebooklm.google.com/','_blank')">🚀 NotebookLM 열기</button></div>
    <div class="seed-note">순서: ① 원고 복사 → NotebookLM 새 노트북에 <b>소스로 붙여넣기</b> → Studio → <b>"슬라이드 자료 생성"</b> → ② 프롬프트 붙여넣기 → 완성 (무료·크레딧 X)</div>`;
  document.getElementById('cs-script').value=script;
  document.getElementById('cs-prompt').value=prompt;
}
function cpy(id){const el=document.getElementById(id);el.select();try{navigator.clipboard.writeText(el.value);}catch(e){try{document.execCommand('copy');}catch(_){}}toast('복사됨 ✅');}
